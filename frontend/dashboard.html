<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RVCE - My programs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1E1E;--bar:#181818;--panel:#252526;--hover:#2A2D2E;--border:#3C3C3C;--text:#D4D4D4;--muted:#A0A3A8;--accent:#6B4BE8;--accent-hover:#7C5CFA;--accent-text:#B9A6FF;--cyan:#4DD6E4;--error:#F48771}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px}
.nav{height:52px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--bar);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:500;letter-spacing:.04em;color:#fff}
.brand b span{color:var(--accent-text)}
.brand small{color:var(--muted);font-size:13px}
.user{display:flex;align-items:center;gap:12px;font-size:14px}
.badge{padding:2px 8px;border:1px solid var(--cyan);border-radius:3px;color:var(--cyan);font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.badge.lecturer{border-color:var(--accent-text);color:var(--accent-text)}
.badge.administrator{border-color:#fff;color:#fff}
.shell{flex:1;display:grid;grid-template-columns:220px 1fr}
.side{display:flex;flex-direction:column;justify-content:space-between;padding:16px 0;background:var(--bar);border-right:1px solid var(--border)}
.side nav{display:flex;flex-direction:column}
.navlink{padding:9px 24px;color:var(--text);text-decoration:none;font-size:14px;border-left:3px solid transparent}
.navlink:hover{background:var(--hover)}
.navlink.active{background:var(--panel);color:#fff;border-left-color:var(--accent-text)}
.idline{margin:0;padding:0 24px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
main{padding:32px;max-width:900px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:24px;font-weight:600;color:#fff}
.sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.go{padding:9px 16px;border:0;border-radius:3px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.go:hover{background:var(--accent-hover)}
.btn{display:inline-block;padding:6px 12px;background:none;border:1px solid var(--border);border-radius:3px;color:var(--text);font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.open{border-color:var(--accent-text);color:var(--accent-text)}
.btn.danger{border-color:rgba(244,135,113,.5);color:var(--error)}
#list{background:var(--panel);border:1px solid var(--border);border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.row+.row{border-top:1px solid var(--border)}
.row:hover{background:var(--hover)}
.pname{font-weight:500;color:#fff;word-break:break-word}
.pdate{margin-top:2px;font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:32px 18px;color:var(--muted);line-height:1.6}
input{width:100%;padding:8px 11px;font:inherit;color:#fff;background:var(--bg);border:1px solid var(--border);border-radius:3px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
input[aria-invalid="true"]{border-color:var(--error)}
.newbox{margin-bottom:16px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:6px}
.newbox label{display:block;margin-bottom:6px;font-size:13px;font-weight:500}
.newbox .line{display:flex;gap:8px}
.err{margin-top:6px;font-size:13px;color:var(--error)}
.msg{margin-bottom:16px;padding:10px 12px;font-size:14px;color:var(--error);border-left:3px solid var(--error);background:rgba(244,135,113,.1)}
.statusbar{display:flex;justify-content:space-between;gap:16px;padding:6px 16px;background:var(--accent);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:12px}
[hidden]{display:none!important}
@media(max-width:820px){.nav{padding:0 16px}.brand small{display:none}.shell{grid-template-columns:1fr}.side{flex-direction:row;padding:0;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}.side nav{flex-direction:row}.navlink{white-space:nowrap;padding:12px 16px;border-left:0;border-bottom:3px solid transparent}.navlink.active{border-bottom-color:var(--accent-text)}.idline{display:none}main{padding:20px 16px}.row{flex-direction:column;align-items:flex-start}.acts{justify-content:flex-start}.statusbar{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="nav">
  <div class="brand"><b>RVC<span>E</span></b><small>Richfield Virtual Computing Environment</small></div>
  <div class="user">
    <span id="welcome">-</span>
    <span class="badge" id="roleBadge">-</span>
    <button class="btn" id="logoutBtn" type="button">Log out</button>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <nav>
      <a class="navlink active" href="dashboard.html" aria-current="page">Programs</a>
      <a class="navlink" href="history.html">Execution history</a>
      <a class="navlink" href="help.html">Help</a>
      <a class="navlink" href="admin.html" id="adminLink" hidden>Admin</a>
    </nav>
    <p class="idline" id="idLine"></p>
  </aside>

  <main>
    <div class="head">
      <div>
        <h1>My programs</h1>
        <p class="sub"><span id="count">0 programs</span> saved in your account</p>
      </div>
      <button class="go" id="newBtn" type="button">New program</button>
    </div>

    <div id="pageMsg" role="alert"></div>

    <form class="newbox" id="newForm" novalidate hidden>
      <label for="np_name">Program name</label>
      <div class="line">
        <input id="np_name" maxlength="100" autocomplete="off">
        <button class="btn open" type="submit">Create</button>
        <button class="btn" type="button" id="np_cancel">Cancel</button>
      </div>
      <div class="err" id="np_err" role="alert"></div>
    </form>

    <div id="list"></div>
  </main>
</div>

<footer class="statusbar">
  <span><span id="who">USER</span> &middot; MODE: <span id="mode"></span></span>
  <span id="status">Loading...</span>
  <time id="clock"></time>
</footer>

<script>
/* ---------- SETTINGS (same as login.html) ---------- */
const CONFIG = {
  DEMO_MODE: true,
  API_URL: "http://localhost:5000/api"
};

/*
  Contract with Vania (draft). Every request sends the login ticket:
  Authorization: Bearer <token>
  GET    /programs               gets {programs:[{programId, programName, dateModified}]}
  POST   /programs               sends {programName, sourceCode}   gets {programId}
  PUT    /programs/{id}/rename   sends {programName}               gets {success:true}
  DELETE /programs/{id}          gets {success:true}
  Any failure: {error:"message"}.  If the ticket is not valid: {error:"unauthorized"}
*/

const $ = id => document.getElementById(id);

/* ---------- MUST BE LOGGED IN ---------- */
const token = sessionStorage.getItem("rvce_token");
const role = sessionStorage.getItem("rvce_role");
const user = sessionStorage.getItem("rvce_user");
const fullName = sessionStorage.getItem("rvce_name");
if (!token) { window.location.replace("login.html"); }

/* ---------- DEMO BACKEND (keeps the list while this tab is open) ---------- */
function demoLoad() {
  try { return JSON.parse(sessionStorage.getItem("rvce_demo_programs")) || null; } catch (e) { return null; }
}
let demoList = demoLoad() || [
  { programId: 1, programName: "Hello world", dateModified: new Date().toISOString() },
  { programId: 2, programName: "Add two numbers", dateModified: new Date().toISOString() }
];
function demoSave() {
  try { sessionStorage.setItem("rvce_demo_programs", JSON.stringify(demoList)); } catch (e) {}
}
async function demoApi(method, path, body) {
  await new Promise(r => setTimeout(r, 250));
  const m = path.match(/^\/programs\/(\d+)/);
  const now = new Date().toISOString();
  if (method === "GET") return { programs: demoList };
  if (method === "POST") {
    const id = demoList.reduce((a, p) => Math.max(a, p.programId), 0) + 1;
    demoList.push({ programId: id, programName: body.programName, dateModified: now });
    demoSave();
    return { programId: id };
  }
  if (method === "PUT" && m) {
    const p = demoList.find(x => x.programId === +m[1]);
    if (!p) return { error: "Program not found." };
    p.programName = body.programName; p.dateModified = now; demoSave();
    return { success: true };
  }
  if (method === "DELETE" && m) {
    demoList = demoList.filter(x => x.programId !== +m[1]); demoSave();
    return { success: true };
  }
  return { error: "Unknown request." };
}

/* ---------- SEND A REQUEST (real or demo) ---------- */
async function api(method, path, body) {
  let data;
  if (CONFIG.DEMO_MODE) data = await demoApi(method, path, body);
  else {
    try {
      const res = await fetch(CONFIG.API_URL + path, {
        method,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: body ? JSON.stringify(body) : undefined
      });
      data = await res.json();
    } catch (e) {
      data = { error: "Cannot reach the server. Please try again." };
    }
  }
  if (data.error === "unauthorized") { logout(); }   // ticket expired: back to login
  return data;
}

/* ---------- SMALL HELPERS ---------- */
function setStatus(t) { $("status").textContent = t; }
function showError(t) {
  $("pageMsg").innerHTML = t ? '<div class="msg"></div>' : "";
  if (t) $("pageMsg").firstChild.textContent = t;     // textContent: safe against injected code
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function niceDate(iso) {
  const d = new Date(iso), p = n => String(n).padStart(2, "0");
  if (isNaN(d)) return "";
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function checkName(v) {
  v = v.trim();
  if (!v) return "Enter a name for the program.";
  if (v.length > 100) return "Use 100 characters or fewer.";
  return "";
}
function logout() {
  sessionStorage.removeItem("rvce_token");
  sessionStorage.removeItem("rvce_role");
  sessionStorage.removeItem("rvce_user");
  sessionStorage.removeItem("rvce_name");
  window.location.replace("login.html");
}

/* ---------- THE LIST ---------- */
let programs = [], renamingId = null, deletingId = null;

function render() {
  const list = $("list");
  list.innerHTML = "";
  $("count").textContent = programs.length + (programs.length === 1 ? " program" : " programs");

  if (!programs.length) {
    list.appendChild(el("div", "empty", "You have no programs yet. Press New program to write your first one."));
    return;
  }
  programs.forEach(p => {
    const row = el("div", "row");
    const info = el("div");
    const acts = el("div", "acts");

    if (renamingId === p.programId) {
      // Rename: the name turns into a text box
      const box = el("form"); box.noValidate = true;
      const inp = el("input"); inp.value = p.programName; inp.maxLength = 100;
      inp.setAttribute("aria-label", "New name for " + p.programName);
      const err = el("div", "err"); err.setAttribute("role", "alert");
      box.append(inp, err);
      box.onsubmit = async e => {
        e.preventDefault();
        const bad = checkName(inp.value);
        if (bad) { err.textContent = bad; inp.setAttribute("aria-invalid", "true"); return; }
        const d = await api("PUT", "/programs/" + p.programId + "/rename", { programName: inp.value.trim() });
        if (d.error) { err.textContent = d.error; return; }
        renamingId = null; load("Program renamed");
      };
      info.appendChild(box);
      const save = el("button", "btn open", "Save"); save.type = "button";
      save.onclick = () => box.requestSubmit();
      const cancel = el("button", "btn", "Cancel"); cancel.type = "button";
      cancel.onclick = () => { renamingId = null; render(); };
      acts.append(save, cancel);
      setTimeout(() => inp.focus(), 0);
    } else {
      info.append(el("div", "pname", p.programName), el("div", "pdate", "Last changed " + niceDate(p.dateModified)));
      if (deletingId === p.programId) {
        // Delete: ask first
        info.append(el("div", "pdate", "Delete this program for good?"));
        const yes = el("button", "btn danger", "Yes, delete"); yes.type = "button";
        yes.onclick = async () => {
          const d = await api("DELETE", "/programs/" + p.programId);
          deletingId = null;
          if (d.error) { showError(d.error); render(); return; }
          load("Program deleted");
        };
        const no = el("button", "btn", "Keep it"); no.type = "button";
        no.onclick = () => { deletingId = null; render(); };
        acts.append(yes, no);
      } else {
        // TODO when the editor exists: it should read ?id= from the address
        const open = el("a", "btn open", "Open"); open.href = "editor.html?id=" + encodeURIComponent(p.programId);
        const ren = el("button", "btn", "Rename"); ren.type = "button";
        ren.onclick = () => { renamingId = p.programId; deletingId = null; render(); };
        const del = el("button", "btn danger", "Delete"); del.type = "button";
        del.onclick = () => { deletingId = p.programId; renamingId = null; render(); };
        acts.append(open, ren, del);
      }
    }
    row.append(info, acts);
    list.appendChild(row);
  });
}

async function load(msg) {
  const d = await api("GET", "/programs");
  if (d.error) { showError(d.error); setStatus("Could not load"); return; }
  showError("");
  programs = d.programs || [];
  render();
  setStatus(msg || "Programs loaded");
}

/* ---------- NEW PROGRAM ---------- */
$("newBtn").onclick = () => { $("newForm").hidden = false; $("np_name").focus(); };
$("np_cancel").onclick = () => { $("newForm").hidden = true; $("np_name").value = ""; $("np_err").textContent = ""; };
$("newForm").onsubmit = async e => {
  e.preventDefault();
  const bad = checkName($("np_name").value);
  $("np_name").setAttribute("aria-invalid", bad ? "true" : "false");
  $("np_err").textContent = bad;
  if (bad) return;
  const d = await api("POST", "/programs", { programName: $("np_name").value.trim(), sourceCode: "" });
  if (d.error) { $("np_err").textContent = d.error; return; }
  $("np_cancel").click();
  load("Program created");
};

$("logoutBtn").onclick = logout;

/* ---------- STATUS BAR ---------- */
function tick() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  $("clock").textContent = p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() + "  " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
tick(); setInterval(tick, 1000);
$("mode").textContent = CONFIG.DEMO_MODE ? "DEMO" : "LIVE";
$("who").textContent = fullName || user || "USER";
$("welcome").textContent = fullName || user || "-";
$("roleBadge").textContent = role || "-";
$("roleBadge").classList.add((role || "").toLowerCase());
$("idLine").textContent = (role === "Student" ? "Student number: " : "Staff number: ") + (user || "-");
// Lecturers and administrators get an extra button. Students never see it.
$("adminLink").hidden = role !== "Administrator" && role !== "Lecturer";
if (role === "Lecturer") $("adminLink").textContent = "Lecturer tools";

if (token) load();
</script>
</body>
</html>
